spring:
  # MySQL 连接配置 部署时可用外置 application.yml 覆盖。
  datasource:
    url: "jdbc:mysql://192.168.0.200:3306/gps_server?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai"
    username: "gps_server"
    password: "bjkj0818"
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: jt808
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
      time: HH:mm:ss

mybatis-plus:
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations:
    - classpath:/mapper/*.xml

server:
  port: 8100

jt-server:
  persistence:
    initialize-schema: true
    # 当前 ClientTest 合水口模拟器使用 GCJ02；接入真实设备前按设备实际坐标系修改。
    coordinate-system: GCJ02
  jt808:
    tcp-port: 51150
    udp-port: 51150
    idle-timeout: 180
    message-package: org.yzh.protocol
    t0801:
      path: D:/jt_data/media_file
    t9208:
      host: 127.0.0.1
      port: 7200
      enabled: true
      path: D:/jt_data/alarm_file
    t9206:
      host: 127.0.0.1
      port: 21
      username: test
      password: test